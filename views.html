<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Views · Facebook</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0d0f14" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#0d0f14; --bg2:#12151c; --card:#161a23;
      --line:#262c3a; --txt:#eef1f7; --mut:#8b93a7;
      --gold:#d8a85a; --green:#5fd29a; --blue:#6aa3ff; --red:#ff7a7a; --pink:#e58ab0;
    }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1a2030 0%,var(--bg) 55%);
         color:var(--txt);font-family:Inter,system-ui,sans-serif;min-height:100vh}
    .wrap{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
    header.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
    .brand h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.9rem;margin:0}
    .brand p{margin:2px 0 0;color:var(--mut);font-size:.82rem}
    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    select,button{font-family:inherit;font-size:.85rem;color:var(--txt);background:var(--card);
      border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
    button:hover,select:hover{border-color:#3a4256}
    .totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
    .kpi .lab{color:var(--mut);font-size:.74rem;text-transform:uppercase;letter-spacing:.5px}
    .kpi .val{font-size:1.5rem;font-weight:800;margin-top:4px}
    .sec-title{display:flex;align-items:center;gap:10px;margin:26px 2px 12px;font-weight:700;font-size:1.1rem}
    .sec-title .tag{font-size:.72rem;color:var(--mut);font-weight:600;background:var(--card);
      border:1px solid var(--line);padding:3px 9px;border-radius:999px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
    .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
    .pcard .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
    .pcard .pn{font-weight:700;font-size:1.02rem}
    .pcard .lang{font-size:.68rem;font-weight:700;color:#0d0f14;background:var(--gold);
      padding:2px 7px;border-radius:6px;margin-left:7px}
    .pcard .fans{color:var(--mut);font-size:.78rem}
    .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}
    .stats .s{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
    .stats .s .l{color:var(--mut);font-size:.66rem;text-transform:uppercase}
    .stats .s .v{font-weight:700;font-size:1.02rem;margin-top:2px}
    .stats .s.hi .v{color:var(--green)}
    .top{font-size:.8rem;color:var(--mut);margin-top:6px}
    .top a{color:var(--blue);text-decoration:none}
    .top a:hover{text-decoration:underline}
    .err{color:var(--red);font-size:.78rem;margin-top:6px}
    .muted{color:var(--mut)}
    .loading{text-align:center;color:var(--mut);padding:60px 0}
    .bar{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--pink));margin-top:8px;opacity:.85}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <h1>Views · Facebook</h1>
        <p id="sub">carregando…</p>
      </div>
      <div class="controls">
        <select id="win">
          <option value="total">Views totais</option>
          <option value="v7">Últimos 7 dias</option>
          <option value="v30">Últimos 30 dias</option>
        </select>
        <button id="reload">↻ Atualizar</button>
      </div>
    </header>

    <div class="totals" id="kpis"></div>
    <div id="content"><div class="loading">Puxando as views das páginas… isso pode levar alguns segundos.</div></div>
  </div>

  <script>
    var KEY = new URLSearchParams(location.search).get('key') || sessionStorage.getItem('pk') || '';
    if (!KEY) { KEY = prompt('Senha do painel:') || ''; }
    if (KEY) sessionStorage.setItem('pk', KEY);
    var DATA = null;

    function nf(n){ return (n||0).toLocaleString('pt-BR'); }
    function compact(n){
      n = n||0;
      if (n >= 1e6) return (n/1e6).toFixed(n>=1e7?0:1).replace('.',',')+' mi';
      if (n >= 1e3) return (n/1e3).toFixed(0)+'k';
      return ''+n;
    }
    function field(){ return document.getElementById('win').value; }

    function render(){
      if (!DATA) return;
      var f = field();
      var pages = DATA.pages.slice().sort(function(a,b){ return (b[f]||0)-(a[f]||0); });

      // KPIs gerais
      var tot=0, t7=0, t30=0, fans=0;
      pages.forEach(function(p){ tot+=p.total; t7+=p.v7; t30+=p.v30; fans+=p.fans; });
      document.getElementById('kpis').innerHTML =
        kpi('Views totais', compact(tot)) +
        kpi('Views 7 dias', compact(t7)) +
        kpi('Views 30 dias', compact(t30)) +
        kpi('Seguidores', compact(fans));

      // Agrupar por persona
      var groups = { 'Monja':[], 'Monge':[], 'Outros':[] };
      pages.forEach(function(p){ (groups[p.persona]||groups['Outros']).push(p); });

      var html = '';
      ['Monja','Monge','Outros'].forEach(function(g){
        var arr = groups[g]; if (!arr || !arr.length) return;
        var gtot = arr.reduce(function(s,p){ return s+(p[f]||0); },0);
        html += '<div class="sec-title">'+g+' <span class="tag">'+arr.length+' páginas · '+compact(gtot)+' views</span></div>';
        html += '<div class="grid">';
        arr.forEach(function(p){ html += card(p,f); });
        html += '</div>';
      });
      document.getElementById('content').innerHTML = html;

      var d = new Date(DATA.updatedAt*1000);
      document.getElementById('sub').textContent = 'Atualizado ' + d.toLocaleString('pt-BR') + ' · ' + pages.length + ' páginas';
    }

    function kpi(l,v){ return '<div class="kpi"><div class="lab">'+l+'</div><div class="val">'+v+'</div></div>'; }

    function card(p,f){
      var lang = p.lang ? '<span class="lang">'+p.lang+'</span>' : '';
      var top = p.top ? '<div class="top">🏆 Maior reel: <a href="https://facebook.com'+(p.top.url||'')+'" target="_blank">'+nf(p.top.views)+' views</a></div>' : '';
      var err = p.err ? '<div class="err">⚠ '+p.err+'</div>' : '';
      var hi = f;
      return '<div class="pcard">'
        + '<div class="ph"><div class="pn">'+p.name+lang+'</div><div class="fans">'+nf(p.fans)+' seg.</div></div>'
        + '<div class="stats">'
        +   '<div class="s'+(hi==='total'?' hi':'')+'"><div class="l">Total</div><div class="v">'+compact(p.total)+'</div></div>'
        +   '<div class="s'+(hi==='v7'?' hi':'')+'"><div class="l">7 dias</div><div class="v">'+compact(p.v7)+'</div></div>'
        +   '<div class="s'+(hi==='v30'?' hi':'')+'"><div class="l">30 dias</div><div class="v">'+compact(p.v30)+'</div></div>'
        + '</div>'
        + '<div class="muted" style="font-size:.76rem">'+nf(p.reels)+' reels analisados</div>'
        + top + err
        + '</div>';
    }

    function load(){
      document.getElementById('content').innerHTML = '<div class="loading">Puxando as views das páginas… isso pode levar alguns segundos.</div>';
      fetch('/api/fb-views?key=' + encodeURIComponent(KEY))
        .then(function(r){ if(r.status===401){ sessionStorage.removeItem('pk'); throw new Error('Senha incorreta'); } return r.json(); })
        .then(function(j){
          if (j.error){ document.getElementById('content').innerHTML = '<div class="err" style="padding:20px">Erro: '+j.error+'</div>'; return; }
          DATA = j; render();
        })
        .catch(function(e){ document.getElementById('content').innerHTML = '<div class="err" style="padding:20px">'+e.message+'</div>'; });
    }

    document.getElementById('win').addEventListener('change', render);
    document.getElementById('reload').addEventListener('click', load);
    load();
  </script>
</body>
</html>
