<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel · ao vivo</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0d0f14" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#0d0f14; --bg2:#12151c; --card:#161a23;
      --line:#262c3a; --txt:#eef1f7; --mut:#8b93a7;
      --gold:#d8a85a; --green:#5fd29a; --blue:#6aa3ff; --red:#ff7a7a;
    }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1a2030 0%,var(--bg) 55%);
         color:var(--txt);font-family:Inter,system-ui,sans-serif;min-height:100vh}
    .wrap{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
    header.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:12px}
    .brand h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.9rem;margin:0;letter-spacing:.3px}
    .live{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--mut);
          background:var(--card);border:1px solid var(--line);padding:6px 11px;border-radius:999px}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,210,154,.55)}70%{box-shadow:0 0 0 10px rgba(95,210,154,0)}100%{box-shadow:0 0 0 0 rgba(95,210,154,0)}}
    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    select,button{font-family:inherit;font-size:.85rem;color:var(--txt);background:var(--card);
      border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
    button:hover,select:hover{border-color:#3a4256}
    .sec-title{display:flex;align-items:center;gap:10px;margin:26px 2px 12px;font-weight:700;font-size:1.05rem}
    .sec-title .ln{flex:1;height:1px;background:var(--line)}
    .grid{display:grid;gap:14px}
    .kpis{grid-template-columns:repeat(4,1fr)}
    .kpis3{grid-template-columns:repeat(3,1fr)}
    @media(max-width:760px){.kpis,.kpis3{grid-template-columns:repeat(2,1fr)}}
    .card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:18px}
    .kpi .lbl{font-size:.74rem;color:var(--mut);font-weight:500;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
    .kpi .val{font-size:1.8rem;font-weight:800;line-height:1.1}
    .kpi .val small{font-size:.9rem;color:var(--mut);font-weight:600}
    .cols{grid-template-columns:1fr 1fr;margin-top:14px}
    .cols3{grid-template-columns:1fr 1fr 1fr;margin-top:14px}
    @media(max-width:760px){.cols,.cols3{grid-template-columns:1fr}}
    .card h2{font-size:.92rem;margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:8px}
    .card h2 .tag{font-size:.7rem;color:var(--mut);font-weight:500}
    .row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
    .row:last-child{border-bottom:0}
    .row .name{flex:1;font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row .num{font-weight:700;color:var(--gold)}
    .row .num.blue{color:var(--blue)}
    .bar{height:7px;border-radius:999px;background:linear-gradient(90deg,var(--gold),#b8862f)}
    .bar.b{background:linear-gradient(90deg,var(--blue),#3f6fd6)}
    .barbg{background:#222838;border-radius:999px;height:7px;overflow:hidden;margin-top:6px}
    .feed .row .when{color:var(--mut);font-size:.8rem;min-width:60px}
    .pill{font-size:.72rem;color:var(--mut);background:#222838;border:1px solid var(--line);padding:3px 8px;border-radius:999px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .muted{color:var(--mut)}
    .empty{color:var(--mut);text-align:center;padding:22px 0;font-size:.88rem}
    .note{background:#1a1c12;border:1px solid #3a3a1e;border-radius:14px;padding:16px;color:#e8d9a3;font-size:.9rem;line-height:1.5}
    #gate{position:fixed;inset:0;background:rgba(8,10,14,.92);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
    #gate .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;max-width:360px;width:100%;text-align:center}
    #gate h3{font-family:'Cormorant Garamond',serif;font-size:1.7rem;margin:0 0 6px}
    #gate p{color:var(--mut);font-size:.88rem;margin:0 0 18px}
    #gate input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);font-size:1rem;margin-bottom:12px}
    #gate button{width:100%;background:linear-gradient(90deg,var(--gold),#b8862f);color:#1a1407;border:0;font-weight:700;padding:12px;border-radius:12px;font-size:1rem}
    #err{color:var(--red);font-size:.82rem;min-height:18px}
    .updated{font-size:.78rem;color:var(--mut)}
  </style>
</head>
<body>
  <div id="gate">
    <div class="box">
      <h3>Painel</h3>
      <p>Digite a senha para acessar.</p>
      <input id="pw" type="password" placeholder="Senha" autocomplete="current-password" />
      <button id="enter">Entrar</button>
      <div id="err"></div>
    </div>
  </div>

  <div class="wrap" id="app" style="display:none">
    <header class="top">
      <div class="brand">
        <h1>Painel · <span class="muted">500 Rituais</span></h1>
        <span class="live"><span class="dot"></span> ao vivo</span>
      </div>
      <div class="controls">
        <select id="range">
          <option value="1">Hoje</option>
          <option value="7" selected>7 dias</option>
          <option value="30">30 dias</option>
          <option value="90">90 dias</option>
        </select>
        <button id="refresh">↻ Atualizar</button>
        <span class="updated" id="updated"></span>
      </div>
    </header>

    <!-- ============ VENDAS ============ -->
    <div class="sec-title">💰 Vendas <span class="ln"></span></div>
    <div class="grid kpis">
      <div class="card kpi"><div class="lbl">Vendas no período</div><div class="val" id="k-count">—</div></div>
      <div class="card kpi"><div class="lbl">Receita no período</div><div class="val" id="k-rev">—</div></div>
      <div class="card kpi"><div class="lbl">Vendas hoje</div><div class="val" id="k-today">—</div></div>
      <div class="card kpi"><div class="lbl">Receita hoje</div><div class="val" id="k-todayrev">—</div></div>
    </div>
    <div id="sales-note"></div>
    <div class="grid cols">
      <div class="card"><h2>🎬 Vendas por vídeo</h2><div id="s-byvideo"></div></div>
      <div class="card"><h2>🌎 Vendas por país</h2><div id="s-bycountry"></div></div>
    </div>
    <div class="card feed" style="margin-top:14px"><h2>🧾 Últimas vendas</h2><div id="s-feed"></div></div>

    <!-- ============ VISITAS ============ -->
    <div class="sec-title">👀 Visitas <span class="ln"></span></div>
    <div id="visits-area"></div>
  </div>

  <script>
    var FLAGS={BR:'🇧🇷',US:'🇺🇸',ES:'🇪🇸',IT:'🇮🇹',FR:'🇫🇷',DE:'🇩🇪',GB:'🇬🇧',PT:'🇵🇹',MX:'🇲🇽',AR:'🇦🇷',CO:'🇨🇴',CL:'🇨🇱',CA:'🇨🇦',CH:'🇨🇭',AT:'🇦🇹',BE:'🇧🇪'};
    function flag(c){return FLAGS[c]||'🏳️';}
    function money(v,cur){try{return new Intl.NumberFormat('pt-BR',{style:'currency',currency:cur||'BRL'}).format(v);}catch(e){return (cur||'')+' '+v.toFixed(2);}}
    function moneyMap(m){var ks=Object.keys(m);if(!ks.length)return '—';return ks.map(function(c){return money(m[c],c);}).join('  ·  ');}
    function ago(ts,now){var s=now-ts;if(s<60)return 'agora';if(s<3600)return Math.floor(s/60)+' min';if(s<86400)return Math.floor(s/3600)+' h';return Math.floor(s/86400)+' d';}
    function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    function startToday(now){return now-(now%86400);}
    function countBy(arr,kf){var m={};arr.forEach(function(x){var k=kf(x)||'—';m[k]=(m[k]||0)+1;});return m;}
    function listRows(map,opts){opts=opts||{};var ks=Object.keys(map).sort(function(a,b){return map[b]-map[a];});if(!ks.length)return '<div class="empty">'+(opts.empty||'Sem dados.')+'</div>';var max=map[ks[0]]||1;return ks.slice(0,12).map(function(k){var pct=Math.round(map[k]/max*100);var label=opts.flag?(flag(k)+' '+esc(k)):esc(k);return '<div class="row"><div style="flex:1;min-width:0"><div class="name">'+label+' <span class="muted">· '+map[k]+'</span></div><div class="barbg"><div class="bar '+(opts.blue?'b':'')+'" style="width:'+pct+'%"></div></div></div></div>';}).join('');}

    var PW='';
    function getPW(){try{return localStorage.getItem('painel_pw')||'';}catch(e){return '';}}

    async function load(){
      var days=document.getElementById('range').value;
      var r;
      try{ r=await fetch('/api/stats?days='+days+'&key='+encodeURIComponent(PW)); }catch(e){return;}
      if(r.status===401){ openGate('Senha incorreta.'); return; }
      var j=await r.json();
      render(j);
      document.getElementById('updated').textContent='atualizado '+new Date().toLocaleTimeString('pt-BR').slice(0,5);
    }

    function render(j){
      var now=j.now;
      // ---- VENDAS ----
      var sales=j.sales||[]; var ts=startToday(now);
      var rev={},tRev={},tCount=0,byV={},byC={};
      sales.forEach(function(s){
        rev[s.currency]=(rev[s.currency]||0)+s.amount;
        if(s.t>=ts){tCount++;tRev[s.currency]=(tRev[s.currency]||0)+s.amount;}
        if(!byV[s.video])byV[s.video]={c:0,r:{}}; byV[s.video].c++; byV[s.video].r[s.currency]=(byV[s.video].r[s.currency]||0)+s.amount;
        byC[s.country]=(byC[s.country]||0)+1;
      });
      document.getElementById('k-count').textContent=sales.length;
      document.getElementById('k-rev').innerHTML=moneyMap(rev);
      document.getElementById('k-today').textContent=tCount;
      document.getElementById('k-todayrev').innerHTML=moneyMap(tRev);
      document.getElementById('sales-note').innerHTML = j.salesError ? '<div class="note" style="margin-top:12px">⚠️ Vendas: configure <b>STRIPE_SECRET_KEY</b> no Vercel ('+esc(j.salesError)+').</div>' : '';
      var vk=Object.keys(byV).sort(function(a,b){return byV[b].c-byV[a].c;});
      document.getElementById('s-byvideo').innerHTML = vk.length? vk.slice(0,12).map(function(v){var o=byV[v];var max=byV[vk[0]].c;var pct=Math.round(o.c/max*100);return '<div class="row"><div style="flex:1;min-width:0"><div class="name">'+esc(v)+' <span class="muted">· '+o.c+'</span></div><div class="barbg"><div class="bar" style="width:'+pct+'%"></div></div></div><div class="num">'+moneyMap(o.r)+'</div></div>';}).join('') : '<div class="empty">Nenhuma venda ainda.</div>';
      document.getElementById('s-bycountry').innerHTML = listRows(byC,{flag:true,empty:'Sem dados de país.'});
      document.getElementById('s-feed').innerHTML = sales.length? sales.slice(0,25).map(function(s){return '<div class="row"><span class="when">'+ago(s.t,now)+'</span><span class="name">'+flag(s.country)+' '+money(s.amount,s.currency)+'</span><span class="pill">'+esc(s.video)+'</span></div>';}).join('') : '<div class="empty">Nenhuma venda no período.</div>';

      // ---- VISITAS ----
      var area=document.getElementById('visits-area');
      if(!j.visits){
        area.innerHTML='<div class="note">Para ver as <b>visitas</b> aqui (país, vídeo, horário, ao vivo), falta ativar o armazenamento gratuito da Vercel. Me avise que eu te guio nos 5 cliques. 🙂</div>';
        return;
      }
      var V=j.visits, recent=V.recent||[];
      var liveCount=recent.filter(function(e){return e.t> now-300;}).length;
      var byVC=countBy(recent,function(e){return e.c;});
      var byVV=countBy(recent,function(e){return e.v;});
      var byVP=countBy(recent,function(e){return e.p;});
      area.innerHTML =
        '<div class="grid kpis3">'
        + '<div class="card kpi"><div class="lbl">Visitas hoje</div><div class="val">'+V.today+'</div></div>'
        + '<div class="card kpi"><div class="lbl">Ao vivo (5 min)</div><div class="val" style="color:var(--green)">'+liveCount+'</div></div>'
        + '<div class="card kpi"><div class="lbl">Visitas totais</div><div class="val">'+V.total+'</div></div>'
        + '</div>'
        + '<div class="grid cols3">'
        + '<div class="card"><h2>🌎 Por país <span class="tag">amostra recente</span></h2>'+listRows(byVC,{flag:true,blue:true,empty:'Sem visitas ainda.'})+'</div>'
        + '<div class="card"><h2>🎬 Por vídeo</h2>'+listRows(byVV,{blue:true,empty:'Sem visitas ainda.'})+'</div>'
        + '<div class="card"><h2>📄 Por página</h2>'+listRows(byVP,{blue:true,empty:'Sem visitas ainda.'})+'</div>'
        + '</div>'
        + '<div class="card feed" style="margin-top:14px"><h2>🟢 Visitantes recentes</h2>'
        + (recent.length? recent.slice(0,30).map(function(e){return '<div class="row"><span class="when">'+ago(e.t,now)+'</span><span class="name">'+flag(e.c)+' <span class="muted">'+esc(e.p||'/')+'</span></span><span class="pill">'+esc(e.v||'direto')+'</span></div>';}).join('') : '<div class="empty">Ninguém ainda. Abra uma página para testar.</div>')
        + '</div>';
    }

    function openGate(msg){document.getElementById('gate').style.display='flex';document.getElementById('app').style.display='none';document.getElementById('err').textContent=msg||'';}
    function enter(){PW=document.getElementById('pw').value.trim();try{localStorage.setItem('painel_pw',PW);}catch(e){}document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';load();}
    document.getElementById('enter').onclick=enter;
    document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')enter();});
    document.getElementById('refresh').onclick=load;
    document.getElementById('range').onchange=load;
    setInterval(function(){if(document.getElementById('app').style.display!=='none')load();},20000);
    PW=getPW();
    if(PW){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';load();}
  </script>
</body>
</html>
