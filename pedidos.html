<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos · Renova Memórias</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0d0f14" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{ --bg:#0d0f14; --bg2:#12151c; --card:#161a23; --line:#262c3a; --txt:#eef1f7; --mut:#8b93a7;
           --gold:#d8a85a; --green:#5fd29a; --blue:#6aa3ff; --red:#ff7a7a; }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1a2030 0%,var(--bg) 55%);
         color:var(--txt);font-family:Inter,system-ui,sans-serif;min-height:100vh}
    .wrap{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
    header.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:12px}
    .brand h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.9rem;margin:0;letter-spacing:.3px}
    .live{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--mut);background:var(--card);border:1px solid var(--line);padding:6px 11px;border-radius:999px}
    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    a.btn,button{font-family:inherit;font-size:.85rem;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none}
    a.btn:hover,button:hover{border-color:#3a4256}
    .updated{font-size:.78rem;color:var(--mut)}
    .grid{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){.grid{grid-template-columns:1fr}}
    .card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:16px}
    .card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
    .offer{font-weight:700;font-size:.95rem}
    .when{color:var(--mut);font-size:.78rem}
    .badge{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
    .b-wait{color:#e8d9a3;background:#241f10;border-color:#3a3a1e}
    .b-paid{color:#0c1f15;background:var(--green);border-color:var(--green)}
    .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
    .thumbs a{display:block;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0a0c10}
    .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
    .notes{font-size:.86rem;color:#cfd6e6;background:#0f131b;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
    .meta{font-size:.74rem;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
    .meta code{color:#9fb0d0}
    .empty{color:var(--mut);text-align:center;padding:40px 0}
    .note{background:#1a1c12;border:1px solid #3a3a1e;border-radius:14px;padding:16px;color:#e8d9a3;font-size:.9rem;line-height:1.5}
    #gate{position:fixed;inset:0;background:rgba(8,10,14,.92);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
    #gate .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;max-width:360px;width:100%;text-align:center}
    #gate h3{font-family:'Cormorant Garamond',serif;font-size:1.7rem;margin:0 0 6px}
    #gate p{color:var(--mut);font-size:.88rem;margin:0 0 18px}
    #gate input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);font-size:1rem;margin-bottom:12px}
    #gate button{width:100%;background:linear-gradient(90deg,var(--gold),#b8862f);color:#1a1407;border:0;font-weight:700;padding:12px;border-radius:12px;font-size:1rem}
    #err{color:var(--red);font-size:.82rem;min-height:18px}
  </style>
</head>
<body>
  <div id="gate">
    <div class="box">
      <h3>Pedidos</h3>
      <p>Digite a senha para acessar.</p>
      <input id="pw" type="password" placeholder="Senha" autocomplete="current-password" />
      <button id="enter">Entrar</button>
      <div id="err"></div>
    </div>
  </div>

  <div class="wrap" id="app" style="display:none">
    <header class="top">
      <div class="brand">
        <h1>Pedidos · <span style="color:var(--mut)">Renova Memórias</span></h1>
        <span class="live" id="count">—</span>
      </div>
      <div class="controls">
        <a class="btn" href="/painel">← Painel de vendas</a>
        <button id="refresh">↻ Atualizar</button>
        <span class="updated" id="updated"></span>
      </div>
    </header>
    <div id="area"></div>
  </div>

  <script>
    function ago(ts,now){var s=now-ts;if(s<60)return 'agora';if(s<3600)return Math.floor(s/60)+' min';if(s<86400)return Math.floor(s/3600)+' h';return Math.floor(s/86400)+' d';}
    function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    function thumb(u){return (String(u).indexOf('/upload/')>-1)?String(u).replace('/upload/','/upload/c_fill,w_240,h_240,q_auto,f_auto/'):u;}
    function statusBadge(s){
      if(s==='pago'||s==='paid') return '<span class="badge b-paid">PAGO</span>';
      return '<span class="badge b-wait">Aguardando pagamento</span>';
    }

    var PW='';
    function getPW(){try{return localStorage.getItem('painel_pw')||'';}catch(e){return '';}}

    async function load(){
      var r; try{ r=await fetch('/api/pedidos?key='+encodeURIComponent(PW)); }catch(e){return;}
      if(r.status===401){ openGate('Senha incorreta.'); return; }
      var j=await r.json();
      render(j);
      document.getElementById('updated').textContent='atualizado '+new Date().toLocaleTimeString('pt-BR').slice(0,5);
    }

    function render(j){
      var now=j.now||Math.floor(Date.now()/1000);
      var ped=j.pedidos||[];
      document.getElementById('count').textContent = ped.length+' pedido'+(ped.length===1?'':'s');
      var area=document.getElementById('area');
      if(!ped.length){
        area.innerHTML='<div class="note">Nenhum pedido ainda. Quando alguém enviar uma foto pelo site (etapa antes do checkout), aparece aqui — mesmo se não finalizar o pagamento.</div>';
        return;
      }
      area.innerHTML='<div class="grid">'+ped.map(function(p){
        var photos=(p.photos||[]);
        var thumbs=photos.length? '<div class="thumbs">'+photos.map(function(u){return '<a href="'+esc(u)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+esc(thumb(u))+'" alt=""></a>';}).join('')+'</div>' : '<div class="notes" style="color:#ff9a9a">Sem foto anexada</div>';
        return '<div class="card">'
          + '<div class="hd"><span class="offer">'+esc(p.offer||'—')+'</span>'+statusBadge(p.status)+'</div>'
          + thumbs
          + (p.notes? '<div class="notes">'+esc(p.notes)+'</div>' : '')
          + '<div class="meta"><span class="when">'+(p.ts?ago(p.ts,now):'')+'</span><code>'+esc(p.order_id||'')+'</code></div>'
          + '</div>';
      }).join('')+'</div>';
    }

    function openGate(msg){document.getElementById('gate').style.display='flex';document.getElementById('app').style.display='none';document.getElementById('err').textContent=msg||'';}
    function enter(){PW=document.getElementById('pw').value.trim();try{localStorage.setItem('painel_pw',PW);}catch(e){}document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';load();}
    document.getElementById('enter').onclick=enter;
    document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')enter();});
    document.getElementById('refresh').onclick=load;
    setInterval(function(){if(document.getElementById('app').style.display!=='none')load();},20000);
    PW=getPW();
    if(PW){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';load();}
  </script>
</body>
</html>
